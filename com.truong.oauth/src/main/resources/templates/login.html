<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Đăng nhập Hệ thống</title>
    <!-- Tải Tailwind CSS từ CDN giúp viết giao diện cực nhanh và đẹp -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Nhúng Font chữ liên kết đồng bộ hệ thống -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen antialiased px-4">

    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl shadow-slate-200/50 border border-slate-100 p-8 space-y-6 transition-all">
        
        <!-- Logo & Tiêu đề -->
        <div class="text-center space-y-2">
            <!-- Thay đường dẫn logo thật của bạn ở đây -->
            <div class="inline-flex p-3 bg-indigo-50 rounded-2xl text-indigo-600 mb-2">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-slate-800 tracking-tight">Chào mừng trở lại</h1>
            <p class="text-sm text-slate-500">Vui lòng đăng nhập tài khoản nhân sự của bạn</p>
        </div>

        <!-- Thông báo lỗi (Nếu có từ Spring Security) -->
        <div th:if="${param.error}" class="bg-rose-50 border border-rose-100 text-rose-600 text-sm p-4 rounded-xl flex items-center space-x-2">
            <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <span>Tên đăng nhập hoặc mật khẩu không chính xác!</span>
        </div>

        <!-- Form Đăng nhập xử lý mặc định bởi Spring Security -->
        <form th:action="@{/login}" method="POST" class="space-y-5">
            
            <!-- Ô nhập Tài khoản -->
            <div class="space-y-1.5">
                <label for="username" class="text-sm font-semibold text-slate-700">Tên đăng nhập</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    </span>
                    <input type="text" id="username" name="username" required autocomplete="username"
                           class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 text-slate-800 font-medium placeholder-slate-400 transition" 
                           placeholder="Nhập username...">
                </div>
            </div>

            <!-- Ô nhập Mật khẩu -->
            <div class="space-y-1.5">
                <div class="flex justify-between items-center">
                    <label for="password" class="text-sm font-semibold text-slate-700">Mật khẩu</label>
                    <a href="#" class="text-xs font-semibold text-indigo-600 hover:text-indigo-500 transition">Quên mật khẩu?</a>
                </div>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                    </span>
                    <input type="password" id="password" name="password" required autocomplete="current-password"
                           class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 text-slate-800 font-medium placeholder-slate-400 transition" 
                           placeholder="••••••••">
                </div>
            </div>

            <!-- Tính năng Ghi nhớ đăng nhập (Tùy chọn) -->
            <div class="flex items-center justify-between pt-1">
                <div class="flex items-center">
                    <input id="remember_me" name="remember-me" type="checkbox" class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-slate-300 rounded-md">
                    <label for="remember_me" class="ml-2 block text-sm text-slate-600 font-medium select-none">Duy trì đăng nhập</label>
                </div>
            </div>

            <!-- Nút bấm Đăng nhập (Hiệu ứng mượt mà như nút bấm Native App) -->
            <button type="submit" 
                    class="w-full py-3.5 px-4 bg-indigo-600 hover:bg-indigo-500 active:scale-[0.98] text-white text-sm font-semibold rounded-xl shadow-lg shadow-indigo-600/20 hover:shadow-indigo-600/30 transition-all duration-150 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-600">
                Đăng Nhập
            </button>
        </form>

        <!-- Footer chân trang bảo mật -->
        <div class="text-center pt-2">
            <p class="text-xs text-slate-400 flex items-center justify-center space-x-1">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
                <span>Hệ thống bảo mật tiêu chuẩn mã hóa OAuth 2.1</span>
            </p>
        </div>
    </div>

</body>
</html>
